<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Etec | Oficina</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='../main.css'>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>.
</head>
<body>
    <main>
        <section class="messages">
            <h1> Mensagens enviadas no chat! </h1>
        </section>
        <section class="textbox">
            <input type="text" id="message" placeholder="Digite sua mensagem">
            <input type="submit" value="Enviar" onclick="SendMessage()">
        </section>
        <audio id="audio" style="display: none;"></audio>
    </main>
    <script>
        const socket = io();

        const queryString = window.location.search
        const params = new URLSearchParams(queryString);
        const UserName = params.get("username");

        function playSound() {
            const audio = document.getElementById("audio");
            audio.src = "./../notification.mp3"; // Replace "path/to/sound.mp3" with the actual path to your sound file
            audio.play();
        }

        addEventListener("keydown",(e)=>{
           if (e.key == "Enter") {
                SendMessage();
           }
        })

        // Abaixo 

        
        socket.on("MessagemRecebida", (data)=>{
            if (UserName == data.userName) {
                document.querySelector(".messages").innerHTML+= `<p class="currentUser"> <span> ${data.userName} </span> ${data.message} </p>`;
            } else {
                document.querySelector(".messages").innerHTML+= `<p> <span> ${data.userName} </span> ${data.message} </p>`;
                playSound();
            }

            document.querySelector(".messages").scrollTop = document.querySelector(".messages").scrollHeight;
        });

        function SendMessage(){
            const data = {
                userName:UserName,
                message:document.querySelector("#message").value
            }
            socket.emit('SendMessage', data);
            document.querySelector('#message').value = "";
        }
    </script>
</body>
</html>
